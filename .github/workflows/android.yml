name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - run: bun install --frozen-lockfile
      - name: Verify packaged Android web assets
        run: |
          test -f android/app/src/main/assets/public/index.html
          test -n "$(find android/app/src/main/assets/public/assets -type f -name '*.js' -print -quit)"
          test -n "$(find android/app/src/main/assets/public/assets -type f -name '*.css' -print -quit)"
      - run: gradle --no-daemon --stacktrace assembleDebug -p android

      - uses: actions/upload-artifact@v4
        with:
          name: study-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk